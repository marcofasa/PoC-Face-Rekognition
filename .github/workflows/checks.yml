name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run mocked workflow and logging checks
        run: python -m unittest discover -s tests -v
      - name: Check syntax and IAM JSON
        run: |
          python -m py_compile run.py tests/test_run.py
          python -m json.tool iam/script-policy.json > /dev/null
          python -m json.tool iam/capture-policy.json > /dev/null
